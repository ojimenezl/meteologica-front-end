<div *ngIf="latestData">
  <h3>Datos en tiempo real</h3>
  <p>Hora: {{ localTime }}</p>
  <p>Temperatura: {{ latestData.temperatureC }} °C</p>
  <p>Energía producida: {{ latestData.energyKWh }} kWh</p>
  <p>Valor bruto: {{ latestData.rawValue }}</p>
</div>
<div *ngIf="!latestData">Cargando datos...</div>
